name: Build Android APK
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # real AdMob ids / Pro product: GitHub → Settings → Secrets and variables → Actions → Variables
      - run: npm run build
        env:
          VITE_ADMOB_BANNER: ${{ vars.ADMOB_BANNER_ID }}
          VITE_ADMOB_INTERSTITIAL: ${{ vars.ADMOB_INTERSTITIAL_ID }}
          VITE_PRO_PRODUCT: ${{ vars.PRO_PRODUCT_ID }}
      # real upload key for Google Play (secrets); without them the test key of the repository is used
      - name: Upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.keystore" >> "$GITHUB_ENV"
          fi
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --no-daemon --stacktrace
      - run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk PassForge.apk
          cp android/app/build/outputs/bundle/release/app-release.aab PassForge.aab
      - uses: actions/upload-artifact@v4
        with:
          name: PassForge-apk
          path: |
            PassForge.apk
            PassForge.aab
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-b${{ github.run_number }}
          name: PassForge Android – build ${{ github.run_number }}
          body: |
            APK de test PassForge (build ${{ github.run_number }}, commit ${{ github.sha }}).
            Lien permanent vers la dernière version : https://github.com/${{ github.repository }}/releases/latest/download/PassForge.apk
          files: |
            PassForge.apk
            PassForge.aab
          make_latest: true
