<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#3b5bfd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PassForge">
<meta name="referrer" content="no-referrer">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>PassForge</title>
<style>
#splash{position:fixed;inset:0;z-index:200;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#2f4cf5 0%,#5b46ff 55%,#8b3dff 100%);color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  transition:opacity .45s ease,transform .45s ease}
#splash.out{opacity:0;transform:scale(1.08);pointer-events:none}
.sp-orb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;animation:spFloat 6s ease-in-out infinite alternate}
.sp-orb.o1{width:320px;height:320px;background:#22d3ee;top:-90px;left:-110px}
.sp-orb.o2{width:280px;height:280px;background:#f472b6;bottom:-80px;right:-90px;animation-delay:-2s}
.sp-orb.o3{width:200px;height:200px;background:#a3e635;bottom:22%;left:-80px;opacity:.3;animation-delay:-4s}
@keyframes spFloat{to{transform:translate(40px,30px) scale(1.15)}}
.sp-grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px);background-size:22px 22px;
  mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 70%);-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0,transparent 70%);animation:spGrid 2.4s ease-out both}
@keyframes spGrid{from{opacity:0;transform:scale(1.3)}}
.sp-center{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.sp-logo{position:relative;width:132px;height:132px;animation:spPop .9s cubic-bezier(.2,1.6,.4,1) both}
.sp-logo::before{content:"";position:absolute;inset:-26px;border-radius:50%;border:2px solid rgba(255,255,255,.35);animation:spRing 1.6s ease-out .5s infinite}
.sp-logo svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 14px 30px rgba(10,10,60,.35))}
.sp-shield{fill:#fff;fill-opacity:0;stroke:#fff;stroke-width:3;stroke-dasharray:300;stroke-dashoffset:300;animation:spDraw .8s ease .25s forwards,spFill .4s ease .9s forwards}
.sp-dot{fill:#5452ff;opacity:0;transform-origin:center;transform-box:fill-box;animation:spDot .35s cubic-bezier(.2,1.8,.4,1) forwards}
.sp-dot.d1{animation-delay:1.05s}.sp-dot.d2{animation-delay:1.2s}.sp-dot.d3{animation-delay:1.35s}
@keyframes spPop{from{transform:scale(.3) rotate(-25deg);opacity:0}}
@keyframes spDraw{to{stroke-dashoffset:0}}
@keyframes spFill{to{fill-opacity:1}}
@keyframes spDot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:scale(1)}}
@keyframes spRing{from{transform:scale(.7);opacity:.9}to{transform:scale(1.5);opacity:0}}
.sp-name{font-size:34px;font-weight:800;letter-spacing:.5px;margin-top:8px}
.sp-name span{display:inline-block;opacity:0;transform:translateY(18px);animation:spUp .5s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes spUp{to{opacity:1;transform:none}}
.sp-pw{font:600 17px ui-monospace,"SF Mono",Menlo,monospace;letter-spacing:2px;padding:9px 16px;border-radius:12px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  opacity:0;animation:spUp .5s ease .7s forwards;min-width:220px;direction:ltr}
.sp-pw b{color:#a7f3d0;font-weight:700}
.sp-tag{font-size:15px;opacity:0;animation:spUp .5s ease 1s forwards;color:rgba(255,255,255,.85);max-width:280px}
.sp-bar{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom));width:120px;height:4px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.sp-bar i{display:block;height:100%;width:100%;background:#fff;border-radius:2px;transform:translateX(-100%);animation:spLoad 1.7s ease-in-out forwards}
@keyframes spLoad{to{transform:none}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body><div id="splash" aria-hidden="true">
  <div class="sp-orb o1"></div><div class="sp-orb o2"></div><div class="sp-orb o3"></div><div class="sp-grid"></div>
  <div class="sp-center">
    <div class="sp-logo"><svg viewBox="0 0 100 100"><path class="sp-shield" d="M50 5C61 12 73 15 86 15V45C86 69 70 86 50 95C30 86 14 69 14 45V15C27 15 39 12 50 5Z"/>
      <circle class="sp-dot d1" cx="33" cy="48" r="6.5"/><circle class="sp-dot d2" cx="50" cy="48" r="6.5"/><circle class="sp-dot d3" cx="67" cy="48" r="6.5"/></svg></div>
    <div class="sp-name"><span style="animation-delay:.45s">P</span><span style="animation-delay:.5s">a</span><span style="animation-delay:.55s">s</span><span style="animation-delay:.6s">s</span><span style="animation-delay:.65s">F</span><span style="animation-delay:.7s">o</span><span style="animation-delay:.75s">r</span><span style="animation-delay:.8s">g</span><span style="animation-delay:.85s">e</span></div>
    <div class="sp-pw" id="sp-pw">••••••••••••••</div>
    <div class="sp-tag" id="sp-tag"></div>
  </div>
  <div class="sp-bar"><i></i></div>
</div><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
