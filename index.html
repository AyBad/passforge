<style>
/* opening screen: only transform / opacity animations (smooth on every phone), no blur, no text */
#splash{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(150deg,#2f4cf5 0%,#5b46ff 55%,#7c3aed 100%);transition:opacity .35s ease}
#splash.out{opacity:0;pointer-events:none}
.sp-logo{position:relative;width:150px;height:150px;will-change:transform;animation:spIn .7s cubic-bezier(.2,1.5,.4,1) both}
.sp-logo.out{animation:spAway .35s ease-in forwards}
.sp-wave{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.55);opacity:0;will-change:transform,opacity;animation:spWave 1.1s ease-out forwards}
.sp-wave.w2{animation-delay:.25s}
.sp-logo svg{position:relative;width:100%;height:100%;overflow:visible}
.sp-shield{fill:#fff}
.sp-in{fill:#fff;transform-origin:50% 50%;transform-box:fill-box;animation:spCore .5s ease .55s both}
.sp-dot{fill:#5452ff;transform-origin:center;transform-box:fill-box;animation:spDot .32s cubic-bezier(.2,1.8,.4,1) both}
.sp-dot.d1{animation-delay:.75s}.sp-dot.d2{animation-delay:.9s}.sp-dot.d3{animation-delay:1.05s}
@keyframes spIn{0%{transform:scale(.2) rotate(-30deg);opacity:0}60%{opacity:1}100%{transform:none}}
@keyframes spWave{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.9);opacity:0}}
@keyframes spCore{from{transform:scale(1)}50%{transform:scale(1.06)}to{transform:scale(1)}}
@keyframes spDot{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes spAway{to{transform:scale(1.35);opacity:0}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
